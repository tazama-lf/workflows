# Please do not attempt to edit this flow without the direct consent from the DevOps team. This file is managed centrally.

# Reusable workflow: builds and pushes stable Docker images for a dual-container repo
# (backend + frontend). Each image is built from its own subdirectory (./backend and
# ./frontend). Both images are versioned from the ROOT package.json - the single platform
# version stamped by the release train - and additionally tagged :latest.
#
# Dual-container repos (DUAL_REPOS in sync-workflows.yml) receive a caller stub of the
# same filename stamped by sync rather than maintaining a full copy of this definition.
#
# Caller stub example (stamped into each dual repo's .github/workflows/dockerhub-image-build-dual.yml):
#
#   on:
#     push:
#       branches: [ "main" ]
#     release:
#       types: [published]
#     workflow_dispatch:
#   jobs:
#     build:
#       permissions:
#         packages: write
#         contents: read
#         attestations: write
#         id-token: write
#       uses: tazama-lf/workflows/.github/workflows/dockerhub-image-build-dual.yml@v1
#       secrets: inherit

name: Publish Docker images (dual)

on:
  workflow_call:

jobs:
  push_backend:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: Push backend Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set ENV variables
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Get package version
        id: pkg_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: tazamaorg/${{ env.REPO_NAME }}-backend
          tags: |
            type=raw,value=${{ steps.pkg_version.outputs.VERSION }}
            type=raw,value=latest

      - name: Build and push backend Docker image
        id: push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            GH_TOKEN=${{ secrets.GH_TOKEN_LIB }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-name: docker.io/tazamaorg/${{ env.REPO_NAME }}-backend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Resolve source PR
        id: src_pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].html_url // empty' 2>/dev/null || true)
          echo "PR_URL=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SERVICE_NAME: ${{ env.REPO_NAME }}-backend
          IMAGE_REPOSITORY: tazamaorg/${{ env.REPO_NAME }}-backend:${{ steps.pkg_version.outputs.VERSION }}
          IMAGE_URL: https://hub.docker.com/r/tazamaorg/${{ env.REPO_NAME }}-backend
          PR_URL: ${{ steps.src_pr.outputs.PR_URL }}
          JOB_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && echo "SLACK_WEBHOOK_URL is not configured. Skipping Slack notification." && exit 0
          SHORT_SHA="${COMMIT_SHA:0:7}"
          curl --fail-with-body -sS -X POST -H 'Content-type: application/json' --data "$(jq -n --arg title "$([ "$JOB_STATUS" = "success" ] && echo "New Dockerhub Image published :ship::ship:" || echo "Dockerhub image build failed :x:")" --arg service "$SERVICE_NAME" --arg status "$JOB_STATUS" --arg image "$IMAGE_REPOSITORY" --arg image_url "$IMAGE_URL" --arg branch "$BRANCH_NAME" --arg sha "$SHORT_SHA" --arg pr "$PR_URL" --arg run "$RUN_URL" '{blocks:[{type:"header",text:{type:"plain_text",text:$title,emoji:true}},{type:"section",fields:([{type:"mrkdwn",text:("*Service:*\n"+$service)},{type:"mrkdwn",text:("*Status:*\n"+$status)},{type:"mrkdwn",text:("*Image:*\n`"+$image+"`")},{type:"mrkdwn",text:("*Branch:*\n`"+$branch+"`")},{type:"mrkdwn",text:("*Commit:*\n`"+$sha+"`")},{type:"mrkdwn",text:("*Tazama Dockerhub:*\n<"+$image_url+"|Open image>")},{type:"mrkdwn",text:("*Workflow Run:*\n<"+$run+"|Open run>")}]+(if $pr != "" then [{type:"mrkdwn",text:("*Source PR:*\n<"+$pr+"|Open PR>")}] else [] end))}]}')" "$SLACK_WEBHOOK_URL"

  push_frontend:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: Push frontend Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set ENV variables
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Get package version
        id: pkg_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: tazamaorg/${{ env.REPO_NAME }}-frontend
          tags: |
            type=raw,value=${{ steps.pkg_version.outputs.VERSION }}
            type=raw,value=latest

      - name: Build and push frontend Docker image
        id: push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            GH_TOKEN=${{ secrets.GH_TOKEN_LIB }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-name: docker.io/tazamaorg/${{ env.REPO_NAME }}-frontend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Resolve source PR
        id: src_pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].html_url // empty' 2>/dev/null || true)
          echo "PR_URL=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SERVICE_NAME: ${{ env.REPO_NAME }}-frontend
          IMAGE_REPOSITORY: tazamaorg/${{ env.REPO_NAME }}-frontend:${{ steps.pkg_version.outputs.VERSION }}
          IMAGE_URL: https://hub.docker.com/r/tazamaorg/${{ env.REPO_NAME }}-frontend
          PR_URL: ${{ steps.src_pr.outputs.PR_URL }}
          JOB_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && echo "SLACK_WEBHOOK_URL is not configured. Skipping Slack notification." && exit 0
          SHORT_SHA="${COMMIT_SHA:0:7}"
          curl --fail-with-body -sS -X POST -H 'Content-type: application/json' --data "$(jq -n --arg title "$([ "$JOB_STATUS" = "success" ] && echo "New Dockerhub Image published :ship::ship:" || echo "Dockerhub image build failed :x:")" --arg service "$SERVICE_NAME" --arg status "$JOB_STATUS" --arg image "$IMAGE_REPOSITORY" --arg image_url "$IMAGE_URL" --arg branch "$BRANCH_NAME" --arg sha "$SHORT_SHA" --arg pr "$PR_URL" --arg run "$RUN_URL" '{blocks:[{type:"header",text:{type:"plain_text",text:$title,emoji:true}},{type:"section",fields:([{type:"mrkdwn",text:("*Service:*\n"+$service)},{type:"mrkdwn",text:("*Status:*\n"+$status)},{type:"mrkdwn",text:("*Image:*\n`"+$image+"`")},{type:"mrkdwn",text:("*Branch:*\n`"+$branch+"`")},{type:"mrkdwn",text:("*Commit:*\n`"+$sha+"`")},{type:"mrkdwn",text:("*Tazama Dockerhub:*\n<"+$image_url+"|Open image>")},{type:"mrkdwn",text:("*Workflow Run:*\n<"+$run+"|Open run>")}]+(if $pr != "" then [{type:"mrkdwn",text:("*Source PR:*\n<"+$pr+"|Open PR>")}] else [] end))}]}')" "$SLACK_WEBHOOK_URL"
