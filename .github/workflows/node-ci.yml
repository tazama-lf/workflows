# Reusable Node.js CI workflow: build, lint, and test.
# Called by consumer repos via a thin stub (node.js.yml) that uses this workflow.
# For more information see: https://docs.github.com/en/actions/sharing-automations/reusing-workflows

# Please do not attempt to edit this flow without the direct consent from the DevOps team. This file is managed centrally.

name: Node.js CI (reusable)

on:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  NPM_SCOPE: "@tazama-lf"
  NPM_REGISTRY: "https://npm.pkg.github.com/"
  NODE_ENV: 'test'

jobs:
  build:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    runs-on: ubuntu-latest
    name: run build
    # Token exposed at job level so nested installs (e.g. monorepo `cd backend && npm ci`) authenticate too.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Use Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 22
          cache: 'npm'
          registry-url: ${{ env.NPM_REGISTRY }}
          scope: ${{ env.NPM_SCOPE }}
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build

  lint:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    runs-on: ubuntu-latest
    name: check style
    # Token exposed at job level so nested installs (e.g. monorepo `cd backend && npm ci`) authenticate too.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Use Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 22
          cache: 'npm'
          registry-url: ${{ env.NPM_REGISTRY }}
          scope: ${{ env.NPM_SCOPE }}
      - name: Install dependencies
        run: npm ci
      - name: Check linting (ESLint)
        run: npm run lint:eslint
      - name: Check linting (Prettier)
        run: npm run lint:prettier
        continue-on-error: true

  test:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    runs-on: ubuntu-latest
    name: check tests
    # Token exposed at job level so nested installs (e.g. monorepo `cd backend && npm ci`) authenticate too.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Use Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 22
          cache: 'npm'
          registry-url: ${{ env.NPM_REGISTRY }}
          scope: ${{ env.NPM_SCOPE }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
