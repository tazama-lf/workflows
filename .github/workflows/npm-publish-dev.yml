name: Publish package to GitHub Packages
on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure Git
      - name: Git configuration
        run: |
          git config --global user.email "busingescott@gmail.com"
          git config --global user.name "scott45"

      # Setup .npmrc file to publish to GitHub Packages
      - name: Setup Node.js (.npmrc)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          # Defaults to the user or organization that owns the workflow file
          scope: '@scott45'

      - name: Version prerelease
        run: npm version prerelease
        env:
          GH_TOKEN: '${{ secrets.GH_TOKEN }}'
      
      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: '${{ secrets.GH_TOKEN }}'

      - name: Run dry
        run: npm run dry
        env:
          GH_TOKEN: '${{ secrets.GH_TOKEN }}'

      - name: Build library
        run: npm run build

      - name: Login to registry
        run: npm login --username '${{ secrets.username }}' --password '${{ secrets.password }}' --registry=https://npm.pkg.github.com

      - name: Publish package
        run: npm publish
        env:
          GH_TOKEN: '${{ secrets.GH_TOKEN }}'
          NODE_AUTH_TOKEN: '${{ secrets.NODE_AUTH_TOKEN }}'
