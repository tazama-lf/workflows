# SPDX-License-Identifier: Apache-2.0

# Central reusable workflow: prepares a release PR from dev to main for package repos.
#
# Version resolution — two separate concepts:
#
# Platform release version (release branch release/vX.Y.Z, PR title, GitHub release tag):
#   1. workflow version input (orchestrator passes REL_VERSION, e.g. 4.0.0)
#   2. RELEASE_VERSION repo/org variable
#   3. package.json .version (fallback when not in a coordinated platform wave)
#
# npm package version (what publish.yml publishes):
#   aligned     - set package.json to the platform release version (e.g. 4.0.0).
#   independent - keep package.json own semver; only strip the prerelease suffix (e.g. 8.2.0-rc.6 → 8.2.0).
#
# Independent libs can ride a v4.0.0 platform release while publishing @scope/pkg@8.2.0.

name: Release train

permissions:
  contents: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      version:
        description: "Platform release version (e.g. 4.0.0). Orchestrator passes REL_VERSION. Falls back to RELEASE_VERSION var, then package.json."
        required: false
        type: string
        default: ""
      version_policy:
        description: "aligned sets package.json to the platform version; independent keeps the repo's own semver."
        required: false
        type: string
        default: "aligned"
      source_branch:
        required: false
        type: string
        default: dev
      target_branch:
        required: false
        type: string
        default: main
      package_scope:
        required: false
        type: string
        default: "@frmscoe"
      node_version:
        required: false
        type: string
        default: "22"
      internal_scopes_regex:
        required: false
        type: string
        default: "^@(tazama-lf|frmscoe)/"
      version_mismatch_behavior:
        required: false
        type: string
        default: fail
      reviewer:
        required: false
        type: string
        default: ""
    secrets:
      GH_TOKEN_LIB:
        required: false
      GH_TOKEN_RELEASE:
        required: false
      GH_USERNAME:
        required: false

  workflow_dispatch:
    inputs:
      version:
        description: "Platform release version (e.g. 4.0.0). Orchestrator passes REL_VERSION. Falls back to RELEASE_VERSION var, then package.json."
        required: false
        default: ""
      version_policy:
        description: "aligned or independent"
        required: false
        default: "aligned"
      source_branch:
        required: false
        default: dev
      target_branch:
        required: false
        default: main
      package_scope:
        required: false
        default: "@frmscoe"
      node_version:
        required: false
        default: "22"
      internal_scopes_regex:
        required: false
        default: "^@(tazama-lf|frmscoe)/"
      version_mismatch_behavior:
        required: false
        default: fail
      reviewer:
        required: false
        default: ""

jobs:
  prepare-release:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate release-train source branch
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch || vars.SOURCE_BRANCH || 'dev' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "$SOURCE_BRANCH" ]; then
            echo "::error::Release train must run from '$SOURCE_BRANCH'. Current branch/ref is '${GITHUB_REF_NAME}'."
            echo "Run release-train from dev/source branch so it can prepare the release branch and PR to main."
            exit 1
          fi

      - name: Checkout source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_branch || vars.SOURCE_BRANCH || 'dev' }}
          token: ${{ secrets.GH_TOKEN_RELEASE || secrets.GH_TOKEN_LIB }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ inputs.node_version || vars.NODE_VERSION || '22' }}
          registry-url: 'https://npm.pkg.github.com/'
          scope: ${{ inputs.package_scope || vars.PACKAGE_SCOPE || '@frmscoe' }}

      - name: Set up GitHub Packages authentication
        shell: bash
        env:
          GH_TOKEN_LIB: ${{ secrets.GH_TOKEN_LIB }}
        run: |
          set -euo pipefail
          echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN_LIB}" >> ~/.npmrc
          echo "@frmscoe:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "@tazama-lf:registry=https://npm.pkg.github.com/" >> ~/.npmrc

      - name: Resolve and validate target version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version || '' }}
          RELEASE_VERSION_VAR: ${{ vars.RELEASE_VERSION || '' }}
          VERSION_POLICY: ${{ inputs.version_policy || vars.PACKAGE_VERSION_POLICY || 'aligned' }}
          MISMATCH_BEHAVIOR: ${{ inputs.version_mismatch_behavior || vars.VERSION_MISMATCH_BEHAVIOR || 'fail' }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::release-train.yml is for package repos and requires package.json. Use dev-to-main-pr.yml for non-code repos."
            exit 1
          fi

          RAW_PACKAGE_VERSION=$(jq -r '.version // empty' package.json)
          PACKAGE_STABLE_VERSION=""
          if [ -n "$RAW_PACKAGE_VERSION" ] && [ "$RAW_PACKAGE_VERSION" != "null" ]; then
            PACKAGE_STABLE_VERSION="${RAW_PACKAGE_VERSION%%-*}"
          fi

          # Platform release version: orchestrator input → RELEASE_VERSION → package.json fallback
          VERSION_SOURCE=""
          if [ -n "$VERSION_INPUT" ]; then
            PLATFORM_VERSION="${VERSION_INPUT%%-*}"
            VERSION_SOURCE="workflow input"
            if [ "$VERSION_INPUT" != "$PLATFORM_VERSION" ]; then
              echo "::warning::Platform version input '$VERSION_INPUT' contained a prerelease suffix. Using '$PLATFORM_VERSION'."
            fi
          elif [ -n "$RELEASE_VERSION_VAR" ]; then
            PLATFORM_VERSION="${RELEASE_VERSION_VAR%%-*}"
            VERSION_SOURCE="RELEASE_VERSION"
            if [ "$RELEASE_VERSION_VAR" != "$PLATFORM_VERSION" ]; then
              echo "::warning::RELEASE_VERSION '$RELEASE_VERSION_VAR' contained a prerelease suffix. Using '$PLATFORM_VERSION'."
            fi
          elif [ -n "$PACKAGE_STABLE_VERSION" ]; then
            PLATFORM_VERSION="$PACKAGE_STABLE_VERSION"
            VERSION_SOURCE="package.json"
          else
            echo "::error::No platform version found. Pass version input, set RELEASE_VERSION repo/org variable, or set package.json version."
            exit 1
          fi

          echo "Version source: ${VERSION_SOURCE} → ${PLATFORM_VERSION}"

          if ! [[ "$PLATFORM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Platform release version '$PLATFORM_VERSION' is not valid semver X.Y.Z."
            exit 1
          fi

          case "$VERSION_POLICY" in
            independent)
              if [ -z "$PACKAGE_STABLE_VERSION" ]; then
                echo "::error::Independent policy requires package.json .version"
                exit 1
              fi
              PACKAGE_VERSION_TO_SET="$PACKAGE_STABLE_VERSION"
              echo "Independent package policy: npm version will remain ${PACKAGE_VERSION_TO_SET}; platform release is ${PLATFORM_VERSION}."
              ;;
            aligned)
              PACKAGE_VERSION_TO_SET="$PLATFORM_VERSION"
              if [ -n "$PACKAGE_STABLE_VERSION" ] && [ "$PACKAGE_STABLE_VERSION" != "$PLATFORM_VERSION" ]; then
                echo "::warning::package.json version '$RAW_PACKAGE_VERSION' resolves to '$PACKAGE_STABLE_VERSION' but platform release is '$PLATFORM_VERSION'."
                if [ "$MISMATCH_BEHAVIOR" = "fail" ]; then
                  exit 1
                fi
              fi
              ;;
            *)
              echo "::error::Unknown version_policy '$VERSION_POLICY'. Use 'independent' or 'aligned'."
              exit 1
              ;;
          esac

          if ! [[ "$PACKAGE_VERSION_TO_SET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Package version '$PACKAGE_VERSION_TO_SET' is not valid semver X.Y.Z."
            exit 1
          fi

          echo "raw_package_version=${RAW_PACKAGE_VERSION:-}" >> "$GITHUB_OUTPUT"
          echo "platform_version=$PLATFORM_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION_TO_SET" >> "$GITHUB_OUTPUT"
          echo "target_version=$PACKAGE_VERSION_TO_SET" >> "$GITHUB_OUTPUT"
          echo "release_branch=release/v${PLATFORM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_source=$VERSION_SOURCE" >> "$GITHUB_OUTPUT"
          echo "Platform release: $PLATFORM_VERSION"
          echo "Package version to set: $PACKAGE_VERSION_TO_SET"

      - name: Resolve internal rc dependencies to stable
        id: resolve_deps
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN_LIB }}
          INTERNAL_SCOPES_REGEX: ${{ inputs.internal_scopes_regex || vars.INTERNAL_SCOPES_REGEX || '^@(tazama-lf|frmscoe)/' }}
        run: |
          set -euo pipefail
          CHANGED=0
          PKG=$(cat package.json)

          for DEP_FIELD in dependencies devDependencies peerDependencies optionalDependencies; do
            KEYS=$(echo "$PKG" | jq -r ".${DEP_FIELD} // {} | keys[]" | grep -E "$INTERNAL_SCOPES_REGEX" || true)
            for KEY in $KEYS; do
              CURRENT=$(echo "$PKG" | jq -r ".${DEP_FIELD}[\"${KEY}\"]")
              echo "Checking ${DEP_FIELD}.${KEY} = ${CURRENT}"

              if [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z] ]]; then
                LATEST=$(npm view "${KEY}" dist-tags.latest 2>/dev/null || true)
                if [ -z "$LATEST" ]; then
                  echo "::error::Cannot resolve stable version for ${KEY} (pinned rc: ${CURRENT})"
                  exit 1
                fi
                if [[ "$LATEST" == *-* ]]; then
                  echo "::error::${KEY}@latest is '${LATEST}' and is still prerelease. Publish stable dependency first."
                  exit 1
                fi
                echo "  -> ${KEY}: ${CURRENT} -> ${LATEST}"
                PKG=$(echo "$PKG" | jq ".${DEP_FIELD}[\"${KEY}\"] = \"${LATEST}\"")
                CHANGED=1

              elif [[ "$CURRENT" =~ ^[\^~][0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z] ]]; then
                RANGE_CHAR="${CURRENT:0:1}"
                BASE="${CURRENT:1}"
                STABLE_BASE="${BASE%%-*}"
                NEW_RANGE="${RANGE_CHAR}${STABLE_BASE}"
                LATEST=$(npm view "${KEY}" dist-tags.latest 2>/dev/null || true)
                if [ -z "$LATEST" ]; then
                  echo "::error::Cannot resolve stable version for ${KEY} (range with rc: ${CURRENT})"
                  exit 1
                fi
                if [[ "$LATEST" == *-* ]]; then
                  echo "::error::${KEY}@latest is '${LATEST}' and is still prerelease. Publish stable dependency first."
                  exit 1
                fi
                echo "  -> ${KEY}: ${CURRENT} -> ${NEW_RANGE}"
                PKG=$(echo "$PKG" | jq ".${DEP_FIELD}[\"${KEY}\"] = \"${NEW_RANGE}\"")
                CHANGED=1

              else
                echo "  ok: no rc dependency rewrite needed"
              fi
            done
          done

          echo "$PKG" | jq '.' > package.json
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Update package version to stable
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.package_version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "package.json version set to $VERSION"

      - name: Regenerate package-lock.json if present
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN_LIB }}
          HUSKY: "0"
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            # --ignore-scripts: prepare/husky must not run during lockfile-only refresh
            npm install --package-lock-only --ignore-scripts
          else
            echo "No package-lock.json found. Skipping lockfile regeneration."
          fi

      # GitHub Git Data API → Verified commits (required by branch protection on many repos).
      # Keep this path; do not replace with a local git commit + force-push.
      # Needs a token that can create/update branches (GH_TOKEN_RELEASE for release window, else GH_TOKEN_LIB).
      - name: Commit and push release branch via GitHub API
        id: push_branch
        shell: bash
        env:
          GH_API_TOKEN: ${{ secrets.GH_TOKEN_RELEASE || secrets.GH_TOKEN_LIB }}
          SOURCE_BRANCH: ${{ inputs.source_branch || vars.SOURCE_BRANCH || 'dev' }}
          PLATFORM_VERSION: ${{ steps.version.outputs.platform_version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/${REPO}"
          BRANCH="$RELEASE_BRANCH"
          AUTH=( -H "Authorization: Bearer ${GH_API_TOKEN}" -H "Accept: application/vnd.github+json" )

          if [ -z "${GH_API_TOKEN:-}" ]; then
            echo "::error::Set GH_TOKEN_RELEASE (preferred) or GH_TOKEN_LIB — token must be able to create/update branches"
            exit 1
          fi

          SOURCE_SHA=$(curl -sS "${AUTH[@]}" \
            "${API}/git/ref/heads/${SOURCE_BRANCH}" | jq -r '.object.sha')
          if [ -z "$SOURCE_SHA" ] || [ "$SOURCE_SHA" = "null" ]; then
            echo "::error::Failed to get ${SOURCE_BRANCH} branch SHA - check token permissions"
            exit 1
          fi
          echo "Source (${SOURCE_BRANCH}) SHA: $SOURCE_SHA"

          # Ensure release branch points at source HEAD (create, or delete+recreate if it exists).
          # Slash branches (release/vX.Y.Z): prefer matching-refs + delete/create over PATCH paths.
          EXISTING_REF=$(curl -sS "${AUTH[@]}" \
            "${API}/git/matching-refs/heads/${BRANCH}" | jq -r '.[0].ref // empty')

          if [ -n "$EXISTING_REF" ]; then
            echo "Branch $BRANCH exists ($EXISTING_REF) - deleting then recreating at $SOURCE_SHA"
            DEL_CODE=$(curl -sS -o /tmp/del-ref.json -w "%{http_code}" -X DELETE "${AUTH[@]}" \
              "${API}/git/refs/heads/${BRANCH}")
            # Fallback encoded path if unencoded DELETE 404s
            if [ "$DEL_CODE" != "204" ] && [ "$DEL_CODE" != "200" ]; then
              BRANCH_ENC="${BRANCH//\//%2F}"
              DEL_CODE=$(curl -sS -o /tmp/del-ref.json -w "%{http_code}" -X DELETE "${AUTH[@]}" \
                "${API}/git/refs/heads/${BRANCH_ENC}")
            fi
            if [ "$DEL_CODE" != "204" ] && [ "$DEL_CODE" != "200" ]; then
              echo "::error::Failed to delete existing ${BRANCH} (HTTP ${DEL_CODE}). Token needs contents:write on this repo."
              cat /tmp/del-ref.json || true
              exit 1
            fi
          fi

          CREATE_BODY=$(curl -sS -o /tmp/create-ref.json -w "%{http_code}" -X POST "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            "${API}/git/refs" \
            -d "{\"ref\":\"refs/heads/${BRANCH}\",\"sha\":\"${SOURCE_SHA}\"}")
          if [ "$CREATE_BODY" != "201" ]; then
            echo "::error::Failed to create ${BRANCH} at ${SOURCE_SHA} (HTTP ${CREATE_BODY})"
            cat /tmp/create-ref.json || true
            exit 1
          fi
          echo "Branch $BRANCH ready at $SOURCE_SHA"

          BRANCH_SHA="$SOURCE_SHA"
          TREE_SHA=$(curl -sS "${AUTH[@]}" \
            "${API}/git/commits/${BRANCH_SHA}" | jq -r '.tree.sha')
          if [ -z "$TREE_SHA" ] || [ "$TREE_SHA" = "null" ]; then
            echo "::error::Failed to get tree SHA for commit $BRANCH_SHA"
            exit 1
          fi

          # Blobs + tree via temp files (avoids ARG_MAX on large package-lock.json)
          TMPDIR_API=$(mktemp -d)
          trap 'rm -rf "$TMPDIR_API"' EXIT

          create_blob() {
            local file="$1"
            local out="$2"
            jq -n --rawfile content "$file" '{content:$content,encoding:"utf-8"}' > "${out}.req"
            curl -sS -X POST "${AUTH[@]}" \
              -H "Content-Type: application/json" \
              "${API}/git/blobs" \
              --data-binary @"${out}.req" | tee "${out}.resp" | jq -r '.sha'
          }

          PKG_BLOB=$(create_blob package.json "${TMPDIR_API}/pkg")
          if [ -z "$PKG_BLOB" ] || [ "$PKG_BLOB" = "null" ]; then
            echo "::error::Failed to create package.json blob"
            cat "${TMPDIR_API}/pkg.resp" || true
            exit 1
          fi

          jq -n --arg sha "$PKG_BLOB" \
            '{tree:[{path:"package.json",mode:"100644",type:"blob",sha:$sha}]}' \
            > "${TMPDIR_API}/tree.json"

          if [ -f package-lock.json ]; then
            LOCK_BLOB=$(create_blob package-lock.json "${TMPDIR_API}/lock")
            if [ -z "$LOCK_BLOB" ] || [ "$LOCK_BLOB" = "null" ]; then
              echo "::error::Failed to create package-lock.json blob"
              cat "${TMPDIR_API}/lock.resp" || true
              exit 1
            fi
            jq --arg sha "$LOCK_BLOB" \
              '.tree += [{path:"package-lock.json",mode:"100644",type:"blob",sha:$sha}]' \
              "${TMPDIR_API}/tree.json" > "${TMPDIR_API}/tree2.json"
            mv "${TMPDIR_API}/tree2.json" "${TMPDIR_API}/tree.json"
          fi

          jq -n --arg base "$TREE_SHA" --slurpfile t "${TMPDIR_API}/tree.json" \
            '{base_tree:$base, tree:$t[0].tree}' > "${TMPDIR_API}/create-tree.json"

          NEW_TREE=$(curl -sS -X POST "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            "${API}/git/trees" \
            --data-binary @"${TMPDIR_API}/create-tree.json" | tee "${TMPDIR_API}/tree.resp" | jq -r '.sha')
          if [ -z "$NEW_TREE" ] || [ "$NEW_TREE" = "null" ]; then
            echo "::error::Failed to create new tree via GitHub API"
            cat "${TMPDIR_API}/tree.resp" || true
            exit 1
          fi
          echo "New tree SHA: $NEW_TREE"

          MSG=$(printf 'chore: prepare platform release v%s (package %s)\n\n- Set package version to %s\n- Resolve internal rc dependencies to stable where required\n- Regenerate package-lock.json when present' \
            "$PLATFORM_VERSION" "$PACKAGE_VERSION" "$PACKAGE_VERSION")

          jq -n --arg msg "$MSG" --arg tree "$NEW_TREE" --arg parent "$BRANCH_SHA" \
            '{message:$msg, tree:$tree, parents:[$parent]}' > "${TMPDIR_API}/commit.json"

          NEW_COMMIT=$(curl -sS -X POST "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            "${API}/git/commits" \
            --data-binary @"${TMPDIR_API}/commit.json" | tee "${TMPDIR_API}/commit.resp" | jq -r '.sha')
          if [ -z "$NEW_COMMIT" ] || [ "$NEW_COMMIT" = "null" ]; then
            echo "::error::Failed to create commit via GitHub API"
            cat "${TMPDIR_API}/commit.resp" || true
            exit 1
          fi
          echo "New commit SHA: $NEW_COMMIT"

          # Point branch at new commit (unencoded path works for slash branches with curl)
          UPD_CODE=$(curl -sS -o /tmp/upd-ref.json -w "%{http_code}" -X PATCH "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            "${API}/git/refs/heads/${BRANCH}" \
            -d "{\"sha\":\"${NEW_COMMIT}\",\"force\":true}")
          if [ "$UPD_CODE" != "200" ]; then
            BRANCH_ENC="${BRANCH//\//%2F}"
            UPD_CODE=$(curl -sS -o /tmp/upd-ref.json -w "%{http_code}" -X PATCH "${AUTH[@]}" \
              -H "Content-Type: application/json" \
              "${API}/git/refs/heads/${BRANCH_ENC}" \
              -d "{\"sha\":\"${NEW_COMMIT}\",\"force\":true}")
          fi
          if [ "$UPD_CODE" != "200" ]; then
            echo "::error::Failed to update ${BRANCH} to ${NEW_COMMIT} (HTTP ${UPD_CODE})"
            cat /tmp/upd-ref.json || true
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Branch $BRANCH updated to verified commit $NEW_COMMIT"

      - name: Open PR to target branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_RELEASE || secrets.GH_TOKEN_LIB }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          TARGET_BRANCH: ${{ inputs.target_branch || vars.TARGET_BRANCH || 'main' }}
          REVIEWER_INPUT: ${{ inputs.reviewer || vars.RELEASE_REVIEWER || '' }}
        run: |
          set -euo pipefail
          PLATFORM_VERSION="${{ steps.version.outputs.platform_version }}"
          PACKAGE_VERSION="${{ steps.version.outputs.package_version }}"
          BRANCH="${{ steps.push_branch.outputs.branch }}"

          printf "## Platform release v%s\n\nThis PR was prepared automatically by the central release-train workflow.\n\n**Changes:**\n- Source package version: %s\n- npm package version after merge: %s\n- Platform GitHub release tag after merge: v%s\n- Resolves internal rc dependencies to stable versions where required\n- Regenerates package-lock.json when present\n\n**After merge:**\n- publish.yml publishes npm package version %s.\n- release.yml creates GitHub release/tag v%s.\n\nPlease review the package and dependency changes before approving.\n" \
            "$PLATFORM_VERSION" "${{ steps.version.outputs.raw_package_version }}" "$PACKAGE_VERSION" "$PLATFORM_VERSION" "$PACKAGE_VERSION" "$PLATFORM_VERSION" > /tmp/pr-body.md

          EXISTING=$(gh pr list --head "$BRANCH" --base "$TARGET_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already exists for $BRANCH -> $TARGET_BRANCH."
            exit 0
          fi

          REVIEWER="${REVIEWER_INPUT:-${GH_USERNAME:-}}"
          REVIEWER_ARGS=()
          if [ -n "$REVIEWER" ]; then
            REVIEWER_ARGS=(--reviewer "$REVIEWER")
          fi

          gh pr create \
            --title "release: v${PLATFORM_VERSION}" \
            --body-file /tmp/pr-body.md \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            "${REVIEWER_ARGS[@]}"
